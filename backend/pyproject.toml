
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora"
version = "0.1.0"
description = "Nexora backend application"
requires-python = ">=3.12"
dependencies = ["pydantic-settings"]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.mypy]
mypy_path = "src"
strict = true
